openapi: 3.0.0
info:
  title: DevCard V2 API
  description: REST API for DevCard platform - developer social business cards
  version: 1.0.0
  contact:
    name: Devius Team
    url: https://devius.io

servers:
  - url: https://devius.io/api
    description: Production
  - url: http://localhost:3000/api
    description: Development

tags:
  - name: DevCards
    description: DevCard profile operations
  - name: GitHub
    description: GitHub integration and synchronization
  - name: Connections
    description: User connection management
  - name: Sharing
    description: QR codes and wallet pass generation
  - name: Analytics
    description: DevCard analytics and metrics

paths:
  # DevCard Operations
  /cards/{username}:
    get:
      summary: Get DevCard by username
      description: Retrieve a public DevCard profile by username slug
      tags: [DevCards]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          description: URL slug (GitHub username or custom)
      responses:
        '200':
          description: DevCard found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevCard'
        '404':
          description: DevCard not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /cards/me:
    get:
      summary: Get current user's DevCard
      description: Retrieve authenticated user's DevCard
      tags: [DevCards]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: DevCard found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: DevCard not created yet

    patch:
      summary: Update DevCard
      description: Update authenticated user's DevCard profile
      tags: [DevCards]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevCardUpdate'
      responses:
        '200':
          description: DevCard updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cards/me/visibility:
    post:
      summary: Toggle DevCard visibility
      description: Make DevCard public or private
      tags: [DevCards]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_public:
                  type: boolean
              required: [is_public]
      responses:
        '200':
          description: Visibility updated
        '401':
          $ref: '#/components/responses/Unauthorized'

  # GitHub Integration
  /github/sync:
    post:
      summary: Sync GitHub data
      description: Manually trigger GitHub profile and repository data sync
      tags: [GitHub]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Sync initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: GitHub sync initiated
                  job_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limit exceeded (GitHub API)

  /github/repos:
    get:
      summary: Get GitHub repositories
      description: Retrieve user's GitHub repositories with stats
      tags: [GitHub]
      security:
        - sessionAuth: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [stars, updated, created]
            default: stars
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        '200':
          description: Repositories retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  repositories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Repository'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Connections
  /connections/requests:
    get:
      summary: Get connection requests
      description: Retrieve pending connection requests for authenticated user
      tags: [Connections]
      security:
        - sessionAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, declined]
            default: pending
      responses:
        '200':
          description: Connection requests retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Send connection request
      description: Send a connection request to another DevCard user
      tags: [Connections]
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_id:
                  type: string
                  format: uuid
                message:
                  type: string
                  maxLength: 500
              required: [recipient_id]
      responses:
        '201':
          description: Connection request sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limit exceeded (20 requests/hour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /connections/requests/{requesterId}:
    patch:
      summary: Respond to connection request
      description: Accept or decline a connection request
      tags: [Connections]
      security:
        - sessionAuth: []
      parameters:
        - name: requesterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [accept, decline, block]
              required: [action]
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Connection request not found

  /connections:
    get:
      summary: Get connections
      description: Retrieve user's accepted connections (network)
      tags: [Connections]
      security:
        - sessionAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Connections retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserProfile'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connections/{userId}:
    delete:
      summary: Remove connection
      description: Remove an accepted connection
      tags: [Connections]
      security:
        - sessionAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Connection removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Connection not found

  # Sharing
  /share/qr/{username}:
    get:
      summary: Generate QR code
      description: Generate QR code for DevCard (returns base64 data URL)
      tags: [Sharing]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
            minimum: 200
            maximum: 1000
            default: 400
      responses:
        '200':
          description: QR code generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_code:
                    type: string
                    description: Base64 data URL
                  url:
                    type: string
        '404':
          description: DevCard not found

  /share/wallet-pass/{username}:
    get:
      summary: Generate wallet pass
      description: Generate Apple Wallet or Google Pay pass
      tags: [Sharing]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [apple, google]
      responses:
        '200':
          description: Wallet pass generated
          content:
            application/vnd.apple.pkpass:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                properties:
                  jwt:
                    type: string
                    description: Google Pay JWT token
                  save_url:
                    type: string
        '404':
          description: DevCard not found
        '500':
          description: Pass generation failed

  # Analytics
  /analytics/me:
    get:
      summary: Get DevCard analytics
      description: Retrieve analytics for authenticated user's DevCard
      tags: [Analytics]
      security:
        - sessionAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: granularity
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly]
            default: daily
      responses:
        '200':
          description: Analytics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /analytics/track:
    post:
      summary: Track analytics event
      description: Track DevCard interaction event (internal use)
      tags: [Analytics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum: [card_view, qr_scan, share]
                username:
                  type: string
                metadata:
                  type: object
                  properties:
                    referrer:
                      type: string
                    country:
                      type: string
                    share_method:
                      type: string
              required: [event_type, username]
      responses:
        '202':
          description: Event tracked
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth.js session cookie

  schemas:
    DevCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        url_slug:
          type: string
        is_public:
          type: boolean
        display_name:
          type: string
        custom_bio:
          type: string
        location:
          type: string
        avatar_url:
          type: string
          format: uri
        github_username:
          type: string
        github_stats:
          $ref: '#/components/schemas/GitHubStats'
        social_links:
          type: object
          properties:
            twitter:
              type: string
            linkedin:
              type: string
            website:
              type: string
            portfolio:
              type: string
        featured_repos:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
          maxItems: 6
        tech_stack:
          type: array
          items:
            type: string
          maxItems: 20
        availability_status:
          type: string
          enum: [open, available, not-available, custom]
        availability_message:
          type: string
        theme:
          type: object
          properties:
            name:
              type: string
            colors:
              type: object
        view_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DevCardUpdate:
      type: object
      properties:
        display_name:
          type: string
        custom_bio:
          type: string
          maxLength: 500
        location:
          type: string
        social_links:
          type: object
        featured_repos:
          type: array
          items:
            type: string
          maxItems: 6
        tech_stack:
          type: array
          items:
            type: string
          maxItems: 20
        availability_status:
          type: string
          enum: [open, available, not-available, custom]
        availability_message:
          type: string
        theme:
          type: object

    GitHubStats:
      type: object
      properties:
        public_repos:
          type: integer
        followers:
          type: integer
        following:
          type: integer
        total_stars:
          type: integer
        contribution_streak:
          type: integer

    Repository:
      type: object
      properties:
        name:
          type: string
        full_name:
          type: string
        description:
          type: string
        html_url:
          type: string
          format: uri
        language:
          type: string
        stargazers_count:
          type: integer
        forks_count:
          type: integer
        updated_at:
          type: string
          format: date-time
        topics:
          type: array
          items:
            type: string

    Connection:
      type: object
      properties:
        requester_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, declined, blocked]
        message:
          type: string
        requested_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        github_username:
          type: string
        avatar_url:
          type: string
          format: uri
        url_slug:
          type: string
        custom_bio:
          type: string

    Analytics:
      type: object
      properties:
        summary:
          type: object
          properties:
            total_views:
              type: integer
            unique_visitors:
              type: integer
            qr_scans:
              type: integer
            shares:
              type: integer
            connection_requests:
              type: integer
        time_series:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              views:
                type: integer
              visitors:
                type: integer
        countries:
          type: object
          additionalProperties:
            type: integer
        referrers:
          type: object
          additionalProperties:
            type: integer

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
