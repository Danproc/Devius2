openapi: 3.1.0
info:
  title: Member Directory API
  version: 1.0.0
  description: API endpoints for searching and filtering StackPass community members

servers:
  - url: /api
    description: Application API

paths:
  /members:
    get:
      summary: Search members
      description: |
        Search and filter StackPass members with pagination. Only returns members who have opted into directory visibility (is_public = true).
        Supports text search, location filtering, tech stack filtering, and achievement-based filtering.
      operationId: searchMembers
      tags:
        - Members
      security:
        - sessionAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of results per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: Search query for name or username (case-insensitive, partial match)
          required: false
          schema:
            type: string
            maxLength: 100
        - name: location
          in: query
          description: Filter by location (case-insensitive, partial match)
          required: false
          schema:
            type: string
            maxLength: 100
        - name: tech
          in: query
          description: Filter by technologies (can be specified multiple times for AND logic)
          required: false
          schema:
            type: array
            items:
              type: string
            maxItems: 10
        - name: achievement
          in: query
          description: Filter by achievement types (can be specified multiple times)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: winners
          in: query
          description: Filter to show only hackathon winners
          required: false
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        '200':
          description: Successful response with members list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersSearchResponse'
        '401':
          description: Unauthorized - user not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /members/filters:
    get:
      summary: Get filter options
      description: |
        Retrieve available filter options for the member directory.
        Returns unique locations, technologies, and achievement types that can be used as filter values.
        This endpoint is typically called once when loading the directory page.
      operationId: getFilterOptions
      tags:
        - Members
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Filter options retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptions'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /user/privacy:
    patch:
      summary: Update directory visibility
      description: |
        Toggle whether the current user's profile appears in the member directory.
        Updates the is_public flag on the user's DevCard.
        Changes take effect within 60 seconds due to cache invalidation.
      operationId: updatePrivacy
      tags:
        - User Settings
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_public
              properties:
                is_public:
                  type: boolean
                  description: Whether to show profile in directory
      responses:
        '200':
          description: Privacy setting updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  is_public:
                    type: boolean
                    description: Updated visibility status
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: NextAuth session cookie (automatically included in browser requests)

  schemas:
    MembersSearchResponse:
      type: object
      required:
        - members
        - pagination
        - filters
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberSummary'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        filters:
          $ref: '#/components/schemas/FilterOptions'

    MemberSummary:
      type: object
      required:
        - id
        - user_id
        - url_slug
        - github_username
        - avatar_url
        - member_number
        - achievement_count
        - hackathon_badges
        - availability_status
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: DevCard ID
        user_id:
          type: string
          format: uuid
          description: User ID
        url_slug:
          type: string
          description: Profile URL slug (e.g., "johndoe")
          example: johndoe
        display_name:
          type: string
          nullable: true
          description: Custom display name (if set, else falls back to name or github_username)
          example: John Doe
        github_username:
          type: string
          description: GitHub username
          example: johndoe
        avatar_url:
          type: string
          format: uri
          description: Profile picture URL
          example: https://avatars.githubusercontent.com/u/123456
        location:
          type: string
          nullable: true
          description: Geographic location
          example: San Francisco, CA
        custom_bio:
          type: string
          nullable: true
          description: Profile bio (truncated to 150 chars for directory display)
          maxLength: 500
          example: Full-stack developer passionate about open source
        tech_stack:
          type: array
          nullable: true
          items:
            type: string
          description: Array of technology names
          example: [TypeScript, React, Node.js, PostgreSQL]
        member_number:
          type: integer
          description: Sequential member number (used for sorting)
          example: 142
        achievement_count:
          type: integer
          description: Total achievements earned
          minimum: 0
          example: 12
        hackathon_badges:
          type: array
          items:
            $ref: '#/components/schemas/HackathonBadge'
        availability_status:
          type: string
          enum: [open, available, not-available, custom]
          description: Member's availability status
          example: available
        created_at:
          type: string
          format: date-time
          description: Member join date
          example: '2024-01-15T10:30:00Z'

    HackathonBadge:
      type: object
      required:
        - badge_type
        - hackathon_name
        - earned_at
      properties:
        badge_type:
          type: string
          enum: [gold, silver, bronze]
          description: Badge type (gold=1st, silver=2nd, bronze=3rd)
        hackathon_name:
          type: string
          description: Name of the hackathon
          example: Spring Hackathon 2024
        earned_at:
          type: string
          format: date-time
          description: Date badge was awarded
          example: '2024-03-20T18:00:00Z'

    PaginationInfo:
      type: object
      required:
        - total
        - pageCount
        - currentPage
        - perPage
      properties:
        total:
          type: integer
          description: Total number of members matching filters
          minimum: 0
          example: 847
        pageCount:
          type: integer
          description: Total number of pages
          minimum: 0
          example: 43
        currentPage:
          type: integer
          description: Current page number
          minimum: 1
          example: 1
        perPage:
          type: integer
          description: Results per page
          minimum: 1
          maximum: 100
          example: 20

    FilterOptions:
      type: object
      required:
        - locations
        - technologies
        - achievement_types
      properties:
        locations:
          type: array
          items:
            type: string
          description: Available location values for filtering
          example: ["San Francisco, CA", "New York, NY", "London, UK"]
        technologies:
          type: array
          items:
            type: string
          description: Available technology names for filtering
          example: ["TypeScript", "React", "Python", "PostgreSQL"]
        achievement_types:
          type: array
          items:
            type: string
          description: Available achievement types for filtering
          example: ["founding_member", "hackathon_champion", "code_master"]

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: Unauthorized

tags:
  - name: Members
    description: Member directory and search operations
  - name: User Settings
    description: User profile and privacy settings
